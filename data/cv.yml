projects:
  - id: twotower
    site_order: 1
    cv_rank: 2
    resume: true
    title: Two-Tower Recommendation with Cold Start Ablation
    tag: Research · Recommender Systems
    tag_class: type-research
    dates: 2025
    role_cv: Primary contributor & project lead · team of {{ m.twotower.team }}
    stack_cv: PyTorch, BPR loss, Yelp Open Dataset
    subtitle: >-
      Found that context features alone outperform the full model on cold-start
      users by {{ m.twotower.cold_user_gain }} NDCG@10 points, while content
      features remain essential for cold restaurants. A
      {{ m.twotower.experiments }}-experiment ablation on a Two-Tower dual
      encoder over {{ m.twotower.reviews }} Yelp reviews.
    tech: [PyTorch, Two-Tower, BPR Loss, Cold Start, Yelp Dataset, Ablation Study,
           NDCG / Hit@K, Gumbel-max Sampling]
    detail_groups:
      - heading: Key Findings
        items:
          - >-
            **Cold users:** context-only model (day-of-week, distance,
            restaurant temporal profiles) achieves NDCG@10 of
            {{ m.twotower.ndcg_context_only }} — beats the full model's
            {{ m.twotower.ndcg_full }} and the popularity baseline by
            {{ m.twotower.pop_baseline_gap }}
          - >-
            **Cold restaurants:** content features are essential — dropping
            user preferences collapses NDCG@10 from
            {{ m.twotower.ndcg_cold_rest }} →
            {{ m.twotower.ndcg_cold_rest_dropped }}; popularity scores 0% by
            design (no training reviews)
          - >-
            **Asymmetric feature importance:** dropping user preferences
            *improves* cold user performance ({{ m.twotower.ndcg_full }} →
            {{ m.twotower.ndcg_no_prefs }}) but cuts cold restaurant
            performance in half — sparse preference estimates are noisier than
            situational context
          - >-
            **Checkin-matched visit times** (UTC → local via per-state IANA
            timezone mapping) lift warm NDCG@10 by
            {{ m.twotower.checkin_warm_lift }} and cold user by
            {{ m.twotower.checkin_cold_lift }}
          - >-
            **Gated fusion underperforms on cold restaurants:** content-gated
            interactions learned on training restaurants don't transfer to
            unseen ones
      - heading: Engineering Highlights
        items:
          - >-
            On-device feature indexing (no DataLoader, no CPU↔GPU transfer per
            batch); per-epoch resampling of geographic negatives and Gumbel-max
            onboarding selections as free data augmentation
          - >-
            Leave-one-out onboarding evaluation prevents information leakage
            when cold users' only signal comes from test reviews
          - >-
            4-stage data pipeline (extract → preprocess → split → feature prep)
            with iterative interaction-density filtering and stratified cold
            start holdout
          - >-
            Vectorized dataset construction dropped from
            {{ m.twotower.build_before }} to {{ m.twotower.build_after }} via
            numpy bulk operations
    media:
      - type: figure
        src: media/platemate_ablation.png
        alt: >-
          Ablation results across warm, cold restaurant, and cold user splits
          showing how feature combinations affect each cold start scenario.
        caption: >-
          Ablation results across three test splits. Context features dominate
          cold users; content features dominate cold restaurants.
    meta: >-
      Team of {{ m.twotower.team }} · Primary contributor & project lead —
      contributed across both towers, pipeline architecture, checkin temporal
      profiles, and geographic negative sampling
    links:
      - {label: Paper (coming soon), href: "#", disabled: true, title: Paper draft in progress}
      - {label: GitHub, href: "https://github.com/Bedrockdude10/cs7180-platemate", external: true}
    cv_bullets:
      - >-
        Found context features alone (day-of-week, distance, restaurant
        temporal profiles) outperform the full model on cold-start users by
        {{ m.twotower.cold_user_gain }} NDCG@10 points, while content features
        remain essential for cold restaurants — an asymmetry in feature
        importance across cold-start regimes.
      - >-
        Designed a leave-one-out onboarding evaluation that prevents
        information leakage when a cold user's only signal comes from held-out
        reviews.
      - >-
        Built a 4-stage data pipeline (extract, preprocess, split, feature
        prep) with iterative interaction-density filtering and stratified
        cold-start holdout; reduced dataset construction from
        {{ m.twotower.build_before }} to {{ m.twotower.build_after }} via
        vectorization.
      - >-
        Implemented on-device feature indexing eliminating per-batch CPU–GPU
        transfer, with per-epoch resampling of geographic negatives and
        Gumbel-max onboarding selections as data augmentation.

  - id: nucleus
    site_order: 2
    cv_rank: 1
    resume: true
    site_id: nucleus-segmentation
    title: Lightweight CNN Encoders for Nucleus Segmentation
    tag: MICCAI 2026 · Poster
    tag_class: type-accepted
    dates: 2025–2026
    role_cv: Sole author · Northeastern University
    stack_cv: PyTorch, timm, PanNuke, MoNuSeg
    subtitle: >-
      Controlled encoder ablation showing a {{ m.nucleus.params }}-param VGG
      U-Net matches MedT (a transformer purpose-built for small medical
      datasets) and outperforms pretrained Swin-T on nucleus segmentation in
      the low-data regime.
    tech: [PyTorch, U-Net, Swin Transformer, ResNet, VGG, Medical Imaging,
           PanNuke / MoNuSeg, timm]
    detail_groups:
      - heading: Key Findings
        items:
          - >-
            VGG U-Net (Dice {{ m.nucleus.dice_pannuke }}) matches ResNet and
            beats pretrained Swin-T by {{ m.nucleus.swin_gap }} Dice points on
            PanNuke ({{ m.nucleus.pannuke_patches }} patches,
            {{ m.nucleus.pannuke_tissues }} tissue types)
          - >-
            On MoNuSeg ({{ m.nucleus.monuseg_wsis }} training WSIs), VGG reaches
            Dice {{ m.nucleus.dice_monuseg }} — equivalent to MedT's published
            number with a {{ m.nucleus.param_ratio }} larger param budget but no
            specialized attention mechanism
          - >-
            Pareto-dominant on inference cost: {{ m.nucleus.memory_ratio }} less
            memory and {{ m.nucleus.latency_ratio }} lower latency than Swin-T
            at equal-or-better accuracy
          - >-
            Hypothesized mechanism: spatial-resolution preservation at skip
            connections + convolutional inductive bias outweighs Swin's
            pretraining advantage in low-data regime
          - >-
            Implications for edge-deployed microscopy, veterinary/rare-disease
            research, and non-H&E staining where foundation model pretraining
            misaligns
    media:
      - type: figure
        src: media/monuseg_comparison.png
        alt: >-
          Qualitative comparison on MoNuSeg test images: input H&E patch, ground
          truth (green), VGG prediction, and Swin prediction with per-image Dice
          scores.
        caption: >-
          Qualitative comparison on MoNuSeg test images. VGG produces tighter
          boundary delineation; Swin over-segments dense regions and misses
          isolated nuclei in sparse ones.
      - type: figure
        src: media/training_curves.png
        alt: >-
          Training and validation Dice score curves across encoder architectures
          (VGG, ResNet, Swin-T) over training epochs on PanNuke and MoNuSeg.
        caption: >-
          Training curves across encoder architectures. VGG converges smoothly;
          Swin-T shows higher variance and slower convergence in the low-data
          regime.
    links:
      - {label: Paper (PDF), href: "media/final_report.pdf", external: true}
      - {label: GitHub, href: "https://github.com/Bedrockdude10/BinaryCellSegmentation", external: true}
    cv_bullets:
      - >-
        Designed and ran a controlled encoder ablation isolating encoder choice
        in U-Net segmentation, holding decoder, augmentation, and optimization
        schedule fixed across VGG, ResNet, and Swin-T backbones.
      - >-
        Established that a {{ m.nucleus.params }}-parameter VGG U-Net (Dice
        {{ m.nucleus.dice_pannuke }} on PanNuke;
        {{ m.nucleus.dice_monuseg }} on MoNuSeg) matches a purpose-built
        medical transformer and is Pareto-dominant on inference cost.
      - >-
        Attributed the result to spatial-resolution preservation at skip
        connections and convolutional inductive bias outweighing Swin's
        pretraining advantage in the low-data regime.
      - >-
        Authored the full manuscript, produced all quantitative and qualitative
        figures, and wrote the discussion.

  - id: flow
    site_order: 3
    cv_rank: 3
    title: Flow Matching for Robotic Manipulation
    tag: Research · Robotics
    tag_class: type-dl
    dates: 2025
    role_cv: Team of {{ m.flow.team }} · Northeastern University
    stack_cv: PyTorch, MuJoCo, MetaWorld
    subtitle: >-
      Imitation learning via continuous-time flow matching on MuJoCo/MetaWorld
      bin-picking — a neural vector field transports Gaussian noise to expert
      action distributions via ODE integration. Scales from a proprioceptive
      single-object baseline to RGBD+language-conditioned action chunking across
      {{ m.flow.objects }}-object scenes.
    tech: [PyTorch, Flow Matching, MuJoCo, MetaWorld, Imitation Learning,
           Action Chunking, CNN (RGBD), RK2 ODE Solver]
    detail_groups:
      - heading: Approach & Findings
        items:
          - >-
            **Flow matching policy:** vector field maps (observation, noisy
            action, flow time τ) → velocity; RK2 integrates from τ=0→1 at
            inference to produce clean action samples without diffusion's
            iterative denoising cost
          - >-
            **Baseline (expt_1):** proprioception-only MLP trained on
            {{ m.flow.demos_baseline }} scripted demos achieves reliable
            single-object bin-picking — validates the flow matching objective on
            a tractable case (see demo)
          - >-
            **Multi-modal scaling (expt_4):** RGBD CNN encoder + per-object text
            embedding extends the policy to {{ m.flow.objects }}-object scenes;
            {{ m.flow.demos_multi }} demos required to cover combinatorial
            object arrangements
          - >-
            **Action chunking (expt_6):** predicts {{ m.flow.chunk }}
            consecutive actions (d_act {{ m.flow.d_act_from }}→{{ m.flow.d_act_to }})
            to improve temporal coherence; compounding error on the harder
            {{ m.flow.objects }}-object task highlights open generalization
            challenges
    media:
      - type: video_pair
        videos:
          - src: media/expt_1_demo.webm
            caption: >-
              Baseline (expt_1): proprioception-only policy completes
              single-object bin-picking from {{ m.flow.demos_baseline }}
              scripted demos.
          - src: media/action_chunking_demo.mp4
            caption: >-
              Action chunking (expt_6): {{ m.flow.chunk }}-step prediction on
              the harder {{ m.flow.objects }}-object task — temporal coherence
              improves over single-step, but {{ m.flow.objects }}-object
              generalization is an open problem.
    meta: Team of {{ m.flow.team }}
    links:
      - {label: GitHub, href: "https://github.com/Bedrockdude10/cs7180-final-project", external: true}
    cv_bullets:
      - >-
        Implemented continuous-time flow matching for imitation learning: a
        neural vector field transports Gaussian noise to expert action
        distributions via RK2 ODE integration, avoiding the iterative denoising
        cost of diffusion policies.
      - >-
        Scaled from a proprioception-only baseline on single-object bin-picking
        to an RGBD- and language-conditioned policy with {{ m.flow.chunk }}-step
        action chunking across {{ m.flow.objects }}-object scenes; characterized
        compounding-error limits on multi-object generalization.

